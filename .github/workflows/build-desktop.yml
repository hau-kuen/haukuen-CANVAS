# 桌面启动器构建
#
# Windows 安装包在 windows-latest 上出，macOS 的 dmg 必须在 macOS runner 上出
# （dmg 依赖 hdiutil / codesign，Windows 上无法交叉构建）。
# canvas-agent 的 node_modules 含平台专用二进制（@openai/codex-<platform>），
# 因此每个平台都要在目标平台上重新 npm install。

name: Build Desktop Launcher

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    windows:
        name: Windows NSIS
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install canvas-agent dependencies
              working-directory: canvas-agent
              run: npm install --no-audit --no-fund

            - name: Install launcher dependencies
              working-directory: launcher
              run: npm install --no-audit --no-fund

            - name: Build installer
              working-directory: launcher
              run: npx electron-builder --win --x64

            - uses: actions/upload-artifact@v4
              with:
                  name: CanvasAgent-Setup-win-x64
                  path: launcher/dist/*.exe
                  if-no-files-found: error

    macos:
        name: macOS DMG (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-14
                      arch: arm64
                    - os: macos-13
                      arch: x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install canvas-agent dependencies
              working-directory: canvas-agent
              run: npm install --no-audit --no-fund

            - name: Install launcher dependencies
              working-directory: launcher
              run: npm install --no-audit --no-fund

            - name: Build dmg
              working-directory: launcher
              run: npx electron-builder --mac --${{ matrix.arch }}
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - uses: actions/upload-artifact@v4
              with:
                  name: CanvasAgent-dmg-${{ matrix.arch }}
                  path: launcher/dist/*.dmg
                  if-no-files-found: error
